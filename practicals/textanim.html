<html>
    <head>
        <style>
            .fade
            {
                opacity: 0;
                animation: fadeIn 5s forwards;
            }
            @keyframes fadeIn
            {
                form

                {
                    opacity: 0;
                }
                to 
                {
                    opacity: 1;
                }
            }

            .btn
            {
                background-color: green;
                color: aliceblue;
                /* transition: transform 0.3s,background 0.3s; */
            }
            .btn:hover{
                transform: scale(1.1);
            }


            /*---------------------------typing------------------*/

            .typing
            {
                width: 0ch;
                overflow: hidden;
                white-space: nowrap;
                border-right: 2px solid black;
                animation: typing 3s steps(15),blink 0.5s step-start infinite alternate;
            }
            @keyframes typing
            {
                form
                {
                    width: 0;
                }
                to 
                {
                    width: 15ch;
                }
            }

            @keyframes blink
            {
                50%
                {
                    border-color: transparent;
                }
            }


        </style>
    </head>
    <body>
        <center><h1 class="fade">Somayu</h1></center>
        <center><button class="btn">Hover Me</button></center>
        <center><h1 class="typing">CSS Animation</h1></center>
    </body>
</html>
